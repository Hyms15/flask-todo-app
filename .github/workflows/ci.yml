name: Flask CI Pipeline

# ------------------------------
# Global permissions (Least Privilege)
# ------------------------------
permissions:
  contents: read
  packages: none
  security-events: none

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # 1️⃣ BUILD & UNIT TEST (with coverage)
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for SonarCloud later

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov pytest-html
          echo "✅ Installed dependencies:"
          pip list

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest --cov=app --cov-report=xml \
           --html=pytest-report.html --self-contained-html \
           --disable-warnings -q
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      - name: Upload pytest HTML report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.html
          retention-days: 14

  # 2️⃣ INTEGRATION TESTg
  integration-test:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Installed dependencies:"
          pip list

      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🚀 Running integration tests..."
          python -m pytest tests/integration --disable-warnings -q

    # 3️⃣ SONARCLOUD ANALYSIS + QUALITY GATE + PR/BRANCH SUPPORT
  sonar-scan:
    runs-on: ubuntu-latest
    needs: [build-test, integration-test]
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for proper diff analysis

      - name: Set up Java (SonarCloud requires Java)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SonarCloud Scan and Wait for Quality Gate
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=false
            ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.head_ref, github.base_ref) || format('-Dsonar.branch.name={0}', github.ref_name) }}

      - name: Upload SonarCloud Report
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: .scannerwork/report-task.txt
          retention-days: 14



  # 4️⃣ LINT DOCKERFILE
  lint-dockerfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  # 5️⃣ BUILD DOCKER IMAGE
  docker-build:
    runs-on: ubuntu-latest
    needs: [sonar-scan, lint-dockerfile]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t flask-todo-app:ci-${{ github.run_number }} .
          echo "✅ Image built successfully: flask-todo-app:ci-${{ github.run_number }}"
      
      # --- 🔒 Trivy scan immediately after build (story 2) ---
      - name: Trivy scan (table output in logs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: flask-todo-app:ci-${{ github.run_number }}
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          # Keep exit-code 0 while wiring. Switch to '1' to enforce failing on HIGH/CRITICAL.
          exit-code: '1'

      # Generate JSON report for artifact/audit
      - name: Install Trivy CLI (for JSON report)
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Generate Trivy JSON report
        run: |
          trivy image \
            --format json \
            --output trivy-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --vuln-type os,library \
            flask-todo-app:ci-${{ github.run_number }}

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report-ci-${{ github.run_number }}
          path: trivy-report.json
          retention-days: 14
  # 6️⃣ PUSH IMAGE TO GHCR
  docker-push:
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          set -e
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          BASE=ghcr.io/${OWNER_LC}/flask-todo-app
          SHORT_SHA=${SHA::7}
          echo "🏗️ Building & pushing tags:"
          echo " - ${BASE}:${RUN}"
          echo " - ${BASE}:${SHORT_SHA}"
          echo " - ${BASE}:latest"
          docker buildx build --push \
            -t ${BASE}:${RUN} \
            -t ${BASE}:${SHORT_SHA} \
            -t ${BASE}:latest .

  # 7️⃣ CONTAINER SECURITY SCAN
  container-scan:
    runs-on: ubuntu-latest
    needs: docker-push
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Run Trivy vulnerability scanner
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=ghcr.io/${OWNER_LC}/flask-todo-app:${{ github.run_number }}
          echo "🔍 Scanning image: $IMAGE_NAME"
          trivy image --exit-code 0 --pkg-types os,library --severity HIGH,CRITICAL --format table $IMAGE_NAME

  # 6️⃣ Send Trivy Scan Results to Slack (Epic 5 - Story 6)
  trivy-slack:
    runs-on: ubuntu-latest
    needs: container-scan
    if: always()
    steps:
      - name: Download Trivy report artifact
        uses: actions/download-artifact@v4
        with:
          name: trivy-scan-report-ci-${{ github.run_number }}
          path: .

      - name: Send detailed Trivy scan results to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Count vulnerabilities from the JSON report
          CRITICALS=$(jq '.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")' trivy-report.json | wc -l)
          HIGHS=$(jq '.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")' trivy-report.json | wc -l)

          STATUS_EMOJI="🔒"
          if [ "$CRITICALS" -gt 0 ]; then
            STATUS_EMOJI="🚨"
          fi

          # Create Slack message payload
          PAYLOAD=$(cat <<EOF
          {
            "text": "${STATUS_EMOJI} *Trivy Image Scan Results* for *${REPO}* \n• Critical: ${CRITICALS}\n• High: ${HIGHS}\n<${RUN_URL}|View Full Report in GitHub Actions>"
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"

  # 8️⃣ BACKUP GHCR IMAGE
  backup-ghcr:
    runs-on: ubuntu-latest
    needs: container-scan
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull latest GHCR image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER_LC}/flask-todo-app:latest
          echo "📦 Pulling image: $IMAGE"
          docker pull "$IMAGE"

      - name: Save image as TAR backup
        env:
          OWNER: ${{ github.repository_owner }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          mkdir -p backups
          IMAGE=ghcr.io/${OWNER_LC}/flask-todo-app:latest
          BACKUP_FILE=backups/flask-todo-backup-${RUN_NUMBER}.tar
          echo "💾 Saving image $IMAGE to $BACKUP_FILE"
          docker save "$IMAGE" -o "$BACKUP_FILE"
          echo "✅ Backup file created: $BACKUP_FILE"
 
  # 9️⃣ INTEGRATE REPORTS WITH JIRA
  jira-report:
    runs-on: ubuntu-latest
    needs: sonar-scan
    if: always()   # run even if the pipeline failed, so Jira sees all statuses
    steps:
      - name: Send report to Jira
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          echo "📢 Sending CI status to Jira..."

          # Create a JSON message for Jira comment
          JSON_PAYLOAD=$(jq -n \
            --arg summary "CI Pipeline Report - $REPO" \
            --arg description "Pipeline [$RUN_URL] finished with status: $STATUS." \
            '{fields: {project: {key: "DEVOPS"}, summary: $summary, description: $description, issuetype: {name: "Task"}}}')

          # POST to Jira API
          curl -X POST \
            -H "Content-Type: application/json" \
            -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            --data "$JSON_PAYLOAD" \
            "$JIRA_URL/rest/api/3/issue/"

          echo "✅ Report sent to Jira."
  
    # 🔒 Story 7 – Jira Ticket for Critical Vulnerabilities
  jira-vulnerability:
    runs-on: ubuntu-latest
    needs: container-scan
    if: always()
    steps:
      - name: Download Trivy report artifact
        uses: actions/download-artifact@v4
        with:
          name: trivy-scan-report-ci-${{ github.run_number }}
          path: .

      - name: Create Jira ticket for critical vulnerabilities
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CRITICALS=$(jq '.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")' trivy-report.json | wc -l)
          if [ "$CRITICALS" -gt 0 ]; then
            echo "🚨 Found $CRITICALS critical vulnerabilities. Creating Jira ticket..."

            SUMMARY="Trivy Scan: ${CRITICALS} Critical Vulnerabilities in ${REPO}"
            DESCRIPTION="Automated scan detected ${CRITICALS} critical issues.\n\nView details: ${RUN_URL}\n\nPlease review and remediate."

            JSON_PAYLOAD=$(jq -n \
              --arg summary "$SUMMARY" \
              --arg description "$DESCRIPTION" \
              '{fields:{project:{key:"DEVOPS"},summary:$summary,description:$description,issuetype:{name:"Bug"}}}')

            curl -X POST -H "Content-Type: application/json" \
                 -u "$JIRA_EMAIL:$JIRA_TOKEN" \
                 --data "$JSON_PAYLOAD" \
                 "$JIRA_URL/rest/api/3/issue/"

            echo "✅ Jira ticket created successfully."
          else
            echo "🎉 No critical vulnerabilities found — no Jira ticket needed."
          fi

        
  # 10 SLACK NOTIFICATION
  notify-slack:
    runs-on: ubuntu-latest
    needs: [backup-ghcr]   # or [jira-report] if you have that job
    if: always()           # ✅ run even if previous jobs fail
    steps:
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
        run: |
          STATUS_EMOJI="❌"
          if [ "$STATUS" = "success" ]; then STATUS_EMOJI="✅"; fi
          
          PAYLOAD=$(cat <<EOF
          {
            "text": "${STATUS_EMOJI} CI Pipeline ${STATUS^^} for <${RUN_URL}|${{ github.repository }}> on branch ${BRANCH} by ${AUTHOR}"
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' \
               --data "$PAYLOAD" \
               "$SLACK_WEBHOOK_URL"
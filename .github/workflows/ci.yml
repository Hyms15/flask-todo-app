name: Flask CI Pipeline

permissions:
  contents: read
  packages: none
  security-events: none

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # 1️⃣ BUILD & UNIT TEST
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests/unit --disable-warnings -q

  # 2️⃣ INTEGRATION TEST
  integration-test:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests/integration --disable-warnings -q

  # 3️⃣ SONARCLOUD ANALYSIS (Epic 4)
  sonar-scan:
    runs-on: ubuntu-latest
    needs: [build-test, integration-test]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.python.version=3.11

  # 4️⃣ LINT DOCKERFILE (Epic 2)
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  # 5️⃣ BUILD DOCKER IMAGE (Epic 2)
  docker-build:
    runs-on: ubuntu-latest
    needs: [sonar-scan, lint-dockerfile]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          echo "🐳 Building Docker image..."
          docker build -t flask-todo-app:ci-${{ github.run_number }} .
          echo "✅ Image built successfully."

  # 6️⃣ PUSH IMAGE TO GHCR (Epic 2 & 3)
  docker-push:
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE=ghcr.io/${OWNER_LC}/flask-todo-app
          SHORT_SHA=${{ github.sha::7 }}
          echo "🏗️ Pushing tags..."
          docker buildx build --push \
            -t ${BASE}:${{ github.run_number }} \
            -t ${BASE}:${SHORT_SHA} \
            -t ${BASE}:latest .

  # 7️⃣ CLEANUP OLD IMAGES (Epic 3)
  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: |
          OWNER=${{ github.repository_owner }}
          PACKAGE=flask-todo-app
          KEEP=5
          TOKEN=${{ secrets.GITHUB_TOKEN }}
          if [ "$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "https://api.github.com/orgs/$OWNER")" = "200" ]; then
            API_BASE="orgs"
          else
            API_BASE="users"
          fi
          RESPONSE=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/$API_BASE/$OWNER/packages/container/$PACKAGE/versions?per_page=100")
          TO_DELETE=$(echo "$RESPONSE" | jq -r --argjson keep "$KEEP" \
            'sort_by(.created_at) | reverse | .[$keep:] | .[].id')
          for id in $TO_DELETE; do
            curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/$API_BASE/$OWNER/packages/container/$PACKAGE/versions/$id"
          done

  # 8️⃣ CONTAINER SECURITY SCAN (Epic 2)
  container-scan:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: aquasecurity/setup-trivy@v0.2.2
      - run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER_LC}/flask-todo-app:${{ github.run_number }}
          echo "🔍 Scanning image $IMAGE"
          trivy image --exit-code 0 --pkg-types os,library --severity HIGH,CRITICAL --format table $IMAGE

  # 9️⃣ BACKUP GHCR IMAGE (Epic 3)
  backup-ghcr:
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER_LC}/flask-todo-app:latest
          mkdir -p backups
          BACKUP_FILE=backups/flask-todo-${{ github.run_number }}.tar
          docker pull "$IMAGE"
          docker save "$IMAGE" -o "$BACKUP_FILE"
          echo "✅ Backup file created."

  # 🔟 WEBHOOK NOTIFY (Epic 3)
  webhook-notify:
    runs-on: ubuntu-latest
    needs: [docker-push, cleanup-old-images, backup-ghcr]
    if: success()
    steps:
      - run: |
          set -euo pipefail
          PAYLOAD=$(printf '{"repo":"%s","sha":"%s","run":"%s","status":"image_pushed"}' \
            "${{ github.repository }}" "${{ github.sha }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | sed 's/^.* //')
          SIG_HEADER="sha256=$SIG"
          echo "📦 Sending webhook..."
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG_HEADER" \
            -d "$PAYLOAD" \
            "${{ secrets.WEBHOOK_URL }}"
          echo "✅ Webhook sent!"

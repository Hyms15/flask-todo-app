---
name: Flask CI Pipeline

# ------------------------------
# Global settings, permissions
# ------------------------------
permissions:
  contents: read
  packages: none
  security-events: none

env:
  OWNER: ${{ github.repository_owner }}
  SHA: ${{ github.sha }}
  RUN: ${{ github.run_number }}

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# ------------------------------
# Jobs
# ------------------------------
jobs:

  # 1️⃣ BUILD & UNIT TEST
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
          echo "✅ Installed dependencies:"
          pip list

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🚀 Running unit tests with coverage..."
          pytest tests/unit --disable-warnings --cov=app --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # 2️⃣ QUALITY GATE - SONARCLOUD ANALYSIS
  quality-gate:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Set up SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.organization=Hymas15
            -Dsonar.projectKey=flask-todo-app
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**
            -Dsonar.exclusions=**/__pycache__/**
            -Dsonar.security.hotspotDetection=true
            -Dsonar.issue.enforceSecurityHotspots=true
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Quality Gate
        uses: SonarSource/sonarcloud-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 3️⃣ INTEGRATION TEST
  integration-test:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🚀 Running integration tests..."
          python -m pytest tests/integration --disable-warnings -q

  # 4️⃣ LINT DOCKERFILE
  lint-dockerfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  # 5️⃣ BUILD DOCKER IMAGE
  docker-build:
    runs-on: ubuntu-latest
    needs: [quality-gate, integration-test, lint-dockerfile]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t flask-todo-app:ci-${{ github.run_number }} .
          echo "✅ Image built successfully: flask-todo-app:ci-${{ github.run_number }}"

  # 6️⃣ PUSH IMAGE TO GHCR
  docker-push:
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image to GHCR
        run: |
          set -e
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          BASE=ghcr.io/${OWNER_LC}/flask-todo-app
          SHORT_SHA=${SHA::7}
          IMAGE_TAG=${RUN}-${SHORT_SHA}
          echo "🏗️ Building & pushing immutable tag: ${IMAGE_TAG}"
          docker buildx build --push -t ${BASE}:${IMAGE_TAG} -t ${BASE}:latest .

  # 7️⃣ CONTAINER SECURITY SCAN
  container-scan:
    runs-on: ubuntu-latest
    needs: docker-push
    permissions:
      contents: read
      security-events: write
      packages: read
    env:
      OWNER: ${{ github.repository_owner }}
      SHA: ${{ github.sha }}
      RUN: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Run Trivy vulnerability scanner
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=${SHA::7}
          IMAGE_TAG=${RUN}-${SHORT_SHA}
          IMAGE_NAME=ghcr.io/${OWNER_LC}/flask-todo-app:${IMAGE_TAG}

          echo "🔍 Scanning image: $IMAGE_NAME"
          trivy image --exit-code 0 --pkg-types os,library --severity HIGH,CRITICAL --format table $IMAGE_NAME

  # 8️⃣ CLEANUP OLD IMAGES
  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Cleanup old GHCR images
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: flask-todo-app
          KEEP: 5
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Owner: $OWNER  Package: $PACKAGE  Keep: $KEEP"

          if [ "$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "https://api.github.com/orgs/$OWNER")" = "200" ]; then
            API_BASE="orgs"
          else
            API_BASE="users"
          fi
          RESPONSE=$(curl -s -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/$API_BASE/$OWNER/packages/container/$PACKAGE/versions?per_page=100")
          TO_DELETE=$(echo "$RESPONSE" | jq -r --argjson keep "$KEEP" 'sort_by(.created_at) | reverse | .[$keep:] | .[].id')
          if [ -z "$TO_DELETE" ]; then
            echo "No versions to delete."
            exit 0
          fi
          for id in $TO_DELETE; do
            echo "Deleting version id: $id"
            curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/$API_BASE/$OWNER/packages/container/$PACKAGE/versions/$id"
          done
          echo "✅ Cleanup finished."

  # 9️⃣ WEBHOOK NOTIFY
  webhook-notify:
    runs-on: ubuntu-latest
    needs: [docker-push, cleanup-old-images]
    if: success()
    permissions:
      contents: read

    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Send webhook notification (signed)
        run: |
          set -euo pipefail
          PAYLOAD=$(printf '{"repo":"%s","sha":"%s","run":"%s","status":"image_pushed"}' "$REPO" "$SHA" "$RUN")
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
          SIG_HEADER="sha256=$SIG"
          echo "📦 Sending payload: $PAYLOAD"
          curl -v -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG_HEADER" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
          echo "✅ Webhook sent successfully!"

  # 🔟 BACKUP GHCR IMAGE
  backup-ghcr:
    runs-on: ubuntu-latest
    needs: [docker-push, cleanup-old-images, webhook-notify]
    if: success() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      actions: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull latest GHCR image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE=ghcr.io/${OWNER_LC}/flask-todo-app
          echo "📥 Pulling latest image: ${BASE}:latest"
          docker pull ${BASE}:latest

      - name: Save image as TAR backup
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p backups
          docker save ghcr.io/${OWNER_LC}/flask-todo-app:latest -o backups/flask-todo-backup-${{ github.run_number }}.tar
          echo "✅ Backup file created: backups/flask-todo-backup-${{ github.run_number }}.tar"

      - name: Upload backup to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-backup
          path: backups/

name: Flask CI Pipeline

# Default permissions for all jobs (Least Privilege)
permissions:
  contents: read
  packages: none
  security-events: none

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Installed dependencies:"
          pip list

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🚀 Running unit tests..."
          python -m pytest tests/unit --disable-warnings -q

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v1.2
        with:
            args: >
              -Dsonar.projectKey=Hyms15
              -Dsonar.organization=your_org_name
              -Dsonar.host.url=https://sonarcloud.io
              -Dsonar.login=${{ secrets.SONAR_TOKEN }}


  integration-test:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read   # no write required

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Installed dependencies:"
          pip list

      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🚀 Running integration tests..."
          python -m pytest tests/integration --disable-warnings -q

  lint-dockerfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-test, integration-test, lint-dockerfile]
    permissions:
      contents: read
      packages: write   # we’re building an image, may need push later
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t flask-todo-app:ci-${{ github.run_number }} .
          echo "✅ Image built successfully: flask-todo-app:ci-${{ github.run_number }}"

  docker-push:
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}


      - name: Build and push Docker image to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          set -e
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          BASE=ghcr.io/${OWNER_LC}/flask-todo-app
          SHORT_SHA=${SHA::7}

          echo "🏗️ Building & pushing tags:"
          echo " - ${BASE}:${RUN}"
          echo " - ${BASE}:${SHORT_SHA}"
          echo " - ${BASE}:latest"

          docker buildx build --push \
            -t ${BASE}:${RUN} \
            -t ${BASE}:${SHORT_SHA} \
            -t ${BASE}:latest .


  container-scan:
    runs-on: ubuntu-latest
    needs: docker-push
    permissions:
      contents: read
      security-events: write
      packages: read   # ✅ allow GHCR image access

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Login to GHCR to allow Trivy to pull the image
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      # ✅ Install Trivy
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      # ✅ Run Trivy scan
      - name: Run Trivy vulnerability scanner
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # Convert OWNER to lowercase
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')

          # Define image name
          IMAGE_NAME=ghcr.io/${OWNER_LC}/flask-todo-app:${{ github.run_number }}
          echo "🔍 Scanning image: $IMAGE_NAME"

          # Run Trivy scan (pkg-types replaces deprecated vuln-type)
          trivy image --exit-code 0 --pkg-types os,library --severity HIGH,CRITICAL --format table $IMAGE_NAME
  backup-ghcr:
    runs-on: ubuntu-latest
    needs: container-scan
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull latest GHCR image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER_LC}/flask-todo-app:latest
          echo "📦 Pulling image: $IMAGE"
          docker pull "$IMAGE"

      - name: Save image as TAR backup
        env:
          OWNER: ${{ github.repository_owner }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          mkdir -p backups
          IMAGE=ghcr.io/${OWNER_LC}/flask-todo-app:latest
          BACKUP_FILE=backups/flask-todo-backup-${RUN_NUMBER}.tar
          echo "💾 Saving image $IMAGE to $BACKUP_FILE"
          docker save "$IMAGE" -o "$BACKUP_FILE"
          echo "✅ Backup file created: $BACKUP_FILE"
